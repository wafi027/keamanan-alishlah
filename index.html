<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Keamanan - Ponpes Al Ishlah Mangkang</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.all.min.js"></script>
<style>
body{font-family:Inter,sans-serif;background:#0f172a;color:#e2e8f0}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:.75rem}
.inp{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;color:#fff}
.inp:focus{outline:none;border-color:#3b82f6}
select.inp option{background:#1e293b}
.btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:.5rem;padding:.4rem .75rem;font-size:.75rem;color:#fff}
.btn:hover{background:rgba(255,255,255,.2)}
.tb{width:100%;font-size:.875rem;text-align:left;white-space:nowrap}
.tb th{padding:.6rem 1rem;color:#94a3b8;background:rgba(255,255,255,.04);font-weight:500}
.tb td{padding:.6rem 1rem;border-top:1px solid rgba(255,255,255,.06)}
.nav{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.5rem;font-size:.875rem;color:#cbd5e1;cursor:pointer;border-left:4px solid transparent}
.nav:hover,.nav.on{background:rgba(59,130,246,.15);border-color:#3b82f6;color:#fff}
.swal2-popup{background:#1e293b!important;color:#e2e8f0!important}
.swal2-title,.swal2-html-container{color:#e2e8f0!important}
</style>
</head>
<body>

<!-- LOGIN / DAFTAR -->
<div id="auth" class="fixed inset-0 flex items-center justify-center p-4">
  <div class="card p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <i class="fas fa-shield-halved text-4xl text-blue-400 mb-3"></i>
      <h1 class="text-2xl font-bold text-white">AL ISHLAH MANGKANG</h1>
      <p class="text-sm text-slate-400">Sistem Manajemen Keamanan Pondok</p>
    </div>
    <form id="fLogin" class="space-y-3">
      <input id="lEmail" type="email" required class="inp" placeholder="Email">
      <input id="lPass" type="password" required class="inp" placeholder="Password">
      <button class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-sm font-medium">Masuk</button>
      <p class="text-xs text-center text-slate-400">Belum punya akun? <a href="#" data-a="toReg" class="text-blue-400">Daftar</a></p>
    </form>
    <form id="fReg" class="space-y-3 hidden">
      <input id="rName" required class="inp" placeholder="Nama lengkap">
      <input id="rEmail" type="email" required class="inp" placeholder="Email">
      <input id="rPass" type="password" minlength="6" required class="inp" placeholder="Password (min. 6 karakter)">
      <p class="text-xs text-slate-400">Akun baru menunggu persetujuan Admin. Peran ditetapkan oleh Admin.</p>
      <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-sm font-medium">Daftar</button>
      <p class="text-xs text-center text-slate-400">Sudah punya akun? <a href="#" data-a="toLogin" class="text-blue-400">Masuk</a></p>
    </form>
  </div>
</div>

<!-- MENUNGGU -->
<div id="pending" class="fixed inset-0 hidden items-center justify-center p-4 bg-slate-900">
  <div class="card p-8 max-w-md text-center">
    <i class="fas fa-hourglass-half text-5xl text-yellow-500 mb-4"></i>
    <h2 class="text-xl font-bold text-white mb-2">Menunggu Persetujuan</h2>
    <p class="text-sm text-slate-400 mb-6">Akun Anda sedang ditinjau Admin. Silakan hubungi pengurus pondok.</p>
    <button data-a="logout" class="btn text-red-400">Keluar</button>
  </div>
</div>

<!-- APLIKASI -->
<div id="app" class="hidden h-screen flex">
  <div id="ov" data-a="menu" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>
  <aside id="side" class="fixed md:static inset-y-0 left-0 w-64 bg-slate-900 md:bg-white/5 border-r border-white/10 flex flex-col z-40 -translate-x-full md:translate-x-0 transition-transform">
    <div class="p-5 border-b border-white/10 flex items-center gap-3">
      <i class="fas fa-shield-halved text-2xl text-blue-400"></i>
      <div><p class="font-bold text-white leading-tight">AL ISHLAH</p><p class="text-xs text-slate-400">Keamanan Terpadu</p></div>
    </div>
    <nav id="nav" class="flex-1 py-3 overflow-y-auto"></nav>
    <div class="p-4 border-t border-white/10"><button data-a="logout" class="btn w-full text-red-400"><i class="fas fa-sign-out-alt"></i> Keluar</button></div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0">
    <header class="flex items-center justify-between px-4 py-3 border-b border-white/10 bg-white/5">
      <div class="flex items-center gap-3"><button data-a="menu" class="md:hidden text-xl"><i class="fas fa-bars"></i></button><h2 id="title" class="font-semibold text-white"></h2></div>
      <div class="text-right"><p id="uname" class="text-sm text-white"></p><p id="urole" class="text-xs text-blue-400"></p></div>
    </header>
    <div id="content" class="flex-1 overflow-y-auto p-4"></div>
  </main>
</div>
<input type="file" id="xl" class="hidden" accept=".xlsx,.xls">

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,getDocs,onSnapshot,collection,query,where,orderBy,limit,writeBatch,increment} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// ====== ISI DENGAN KONFIGURASI FIREBASE ANDA (Project settings > Your apps) ======
const cfg={apiKey:"AIzaSyAkl8gvMG7tf17XpiHNYSXS8s_myb4PLuU",authDomain:"sistem-manajemen-keamanan.firebaseapp.com",projectId:"sistem-manajemen-keamanan",appId:"1:439469126990:web:e40d68fdfe639f49c65a1f"};
if(cfg.apiKey.startsWith("ISI")){document.body.innerHTML='<p class="p-8">Isi <b>firebaseConfig</b> di dalam file index.html terlebih dahulu.</p>';throw new Error("config")}

const db=getFirestore(initializeApp(cfg)),auth=getAuth();
const $=s=>document.querySelector(s),val=id=>document.getElementById(id).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH=[0,100,200,300],LV=[['Aman','emerald'],['SP1','yellow'],['SP2','orange'],['SP3','red']];
const lvl=p=>p>=300?3:p>=200?2:p>=100?1:0;
const TODAY=new Date().toLocaleDateString('sv-SE');
const dt=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'});
const MENU={Admin:['dashboard','users','santri','alumni','peraturan','pelanggaran','absensi','rekap','logs'],Keamanan:['dashboard','santri','peraturan','pelanggaran','absensi','rekap'],Pengurus:['absensi','rekap'],Pengasuh:['dashboard','santri','peraturan','pelanggaran'],'Wali Santri':['dashboard','pelanggaran']};
const LBL={dashboard:['chart-pie','Dashboard'],users:['user-shield','Pengguna'],santri:['users','Data Santri'],alumni:['user-graduate','Alumni'],peraturan:['gavel','Peraturan'],pelanggaran:['clipboard-list','Pelanggaran'],absensi:['qrcode','Absensi'],rekap:['calendar-check','Rekap Absensi'],logs:['history','Log Akses']};
const ERR={'auth/invalid-credential':'Email atau password salah','auth/email-already-in-use':'Email sudah terdaftar','auth/weak-password':'Password minimal 6 karakter'};
const toast=(t,i='success')=>Swal.fire({toast:true,position:'top',title:t,icon:i,timer:2200,showConfirmButton:false});
const dlg=(title,html,pre)=>Swal.fire({title,html,showCancelButton:true,confirmButtonText:'Simpan',cancelButtonText:'Batal',focusConfirm:false,preConfirm:pre});
const opts=(a,f)=>a.map(f).join('');
const rows=(a,f,n)=>a.length?a.map(f).join(''):`<tr><td colspan="${n}" class="text-center text-slate-400">Belum ada data</td></tr>`;
const bar=(t,b='')=>`<div class="flex flex-wrap items-center justify-between gap-2 mb-3"><h3 class="font-semibold text-white">${t}</h3><div class="flex gap-2">${b}</div></div>`;
const badge=p=>{const[l,c]=LV[lvl(p)];return `<span class="font-bold text-${c}-400">${p}</span> <span class="text-[10px] px-1.5 rounded border border-${c}-500/40 bg-${c}-500/20 text-${c}-400">${l}</span>`};
const tbl=(h,b)=>`<div class="card overflow-x-auto"><table class="tb"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b}</tbody></table></div>`;

let U,view,unsubs=[],reg=false,qr,lastScan=0,ch=[];
const S={rekap:[],bulan:TODAY.slice(0,7),users:[],santri:[],alumni:[],peraturan:[],pelanggaran:[],absensi:[],logs:[],q:''};
const isStaff=()=>U.role==='Admin'||U.role==='Keamanan';

// ================= AUTH =================
const show=id=>['auth','pending','app'].forEach(s=>{const e=document.getElementById(s);e.classList.toggle('hidden',s!==id);e.classList.toggle('flex',s===id)});
onAuthStateChanged(auth,u=>{if(reg)return;u?boot(u):(stop(),show('auth'))});
$('#fLogin').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,val('lEmail'),$('#lPass').value)}catch(x){Swal.fire('Gagal',ERR[x.code]||x.message,'error')}};
$('#fReg').onsubmit=async e=>{e.preventDefault();reg=true;try{
  const r=await createUserWithEmailAndPassword(auth,val('rEmail'),$('#rPass').value);
  await setDoc(doc(db,'users',r.user.uid),{name:val('rName'),email:val('rEmail'),role:'Wali Santri',status:'pending',childId:null,createdAt:Date.now()});
  reg=false;await boot(r.user)}catch(x){reg=false;Swal.fire('Gagal',ERR[x.code]||x.message,'error')}};
async function boot(u){
  const d=await getDoc(doc(db,'users',u.uid));
  if(!d.exists()){await signOut(auth);return}
  U={uid:u.uid,...d.data()};
  if(U.status==='pending')return show('pending');
  if(U.status!=='approved'){await Swal.fire('Akses ditolak','Akun tidak aktif. Hubungi Admin.','error');return signOut(auth)}
  $('#uname').textContent=U.name;$('#urole').textContent=U.role;
  $('#nav').innerHTML=MENU[U.role].map(m=>`<a class="nav" data-a="go" data-id="${m}"><i class="fas fa-${LBL[m][0]} w-5"></i>${LBL[m][1]}</a>`).join('');
  show('app');listen();go(MENU[U.role][0]);log('Login');
}
function stop(){unsubs.forEach(f=>f());unsubs=[];U=null}
const log=a=>U&&addDoc(collection(db,'logs'),{uid:U.uid,email:U.email,role:U.role,aksi:a,createdAt:Date.now()}).catch(()=>{});

// ================= DATA (realtime, sesuai role) =================
function listen(){
  const L=(n,q)=>unsubs.push(onSnapshot(q,s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));paint()},e=>console.error(n,e.code)));
  const c=n=>collection(db,n),r=U.role;
  L('peraturan',c('peraturan'));
  if(r==='Wali Santri'){
    if(!U.childId)return;
    unsubs.push(onSnapshot(doc(db,'santri',U.childId),d=>{S.santri=d.exists()?[{id:d.id,...d.data()}]:[];paint()}));
    L('pelanggaran',query(c('pelanggaran'),where('santriId','==',U.childId)));return}
  L('santri',c('santri'));
  if(r!=='Pengurus')L('pelanggaran',query(c('pelanggaran'),orderBy('createdAt','desc'),limit(300)));
  if(r==='Admin'||r==='Keamanan'||r==='Pengurus')L('absensi',query(c('absensi'),where('tanggal','==',TODAY)));
  if(r==='Admin'){L('users',c('users'));L('alumni',c('alumni'));L('logs',query(c('logs'),orderBy('createdAt','desc'),limit(150)))}
}

// ================= NAVIGASI & RENDER =================
function go(v){
  scanStop();view=v;if(v==='rekap')loadRekap();
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.id===v));
  $('#title').textContent=LBL[v][1];
  $('#side').classList.add('-translate-x-full');$('#ov').classList.add('hidden');
  paint(true);
}
function paint(force){
  if(!U||!view)return;
  if(view==='absensi'&&!force&&$('#abs')){$('#abs').innerHTML=absRows();$('#abs-sum').textContent=absSum();return}
  const hadQ=document.activeElement?.id==='q';
  $('#content').innerHTML=V[view]();
  if(view==='dashboard')charts();
  if(hadQ){const q=$('#q');q.focus();q.setSelectionRange(99,99)}
}
const V={
dashboard(){
  const s=S.santri,c=[0,0,0,0];s.forEach(x=>c[lvl(x.poin||0)]++);
  const warn=U.role==='Wali Santri'&&!U.childId?'<p class="card p-4 mb-4 text-yellow-400 text-sm">Akun Anda belum dihubungkan dengan santri. Hubungi Admin.</p>':'';
  return warn+`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${[['Santri aktif',s.length,'blue'],['SP 1',c[1],'yellow'],['SP 2',c[2],'orange'],['SP 3',c[3],'red']].map(([a,b,k])=>`<div class="card p-4"><p class="text-xs text-slate-400">${a}</p><p class="text-2xl font-bold text-${k}-400">${b}</p></div>`).join('')}</div>
  <div class="grid lg:grid-cols-2 gap-4 mt-4"><div class="card p-4 h-64"><canvas id="c1"></canvas></div><div class="card p-4 h-64"><canvas id="c2"></canvas></div></div>`},
users(){
  const R=['Admin','Keamanan','Pengurus','Pengasuh','Wali Santri'];
  return bar('Manajemen Pengguna')+tbl(['Nama / Email','Peran','Status','Aksi'],rows(S.users,u=>{
    const me=u.id===U.uid,sel=`<select class="inp !w-auto !py-1" id="r-${esc(u.id)}" data-c="${esc(u.id)}" ${me?'disabled':''}>${opts(R,r=>`<option ${r===u.role?'selected':''}>${r}</option>`)}</select>`;
    let a='';
    if(!me){a=u.status==='approved'?`<button class="btn" data-a="block" data-id="${esc(u.id)}">Nonaktifkan</button>`:`<button class="btn text-emerald-400" data-a="approve" data-id="${esc(u.id)}">Setujui</button>`;
      if(u.role==='Wali Santri')a+=` <button class="btn" data-a="linkW" data-id="${esc(u.id)}">${u.childId?'Anak: '+esc(u.childId):'Hubungkan santri'}</button>`}
    return `<tr><td><p class="text-white">${esc(u.name)}</p><p class="text-xs text-slate-400">${esc(u.email)}</p></td><td>${sel}</td><td class="uppercase text-xs ${u.status==='approved'?'text-emerald-400':'text-yellow-400'}">${esc(u.status)}</td><td>${a}</td></tr>`},4))},
santri(){
  const st=isStaff();
  return bar('Data Santri',st?'<button class="btn" data-a="imp">Import</button><button class="btn" data-a="exp">Export</button><button class="btn bg-blue-600" data-a="newS">+ Santri</button>':'')+
  `<div class="card"><div class="p-3"><input id="q" class="inp max-w-xs" placeholder="Cari ID / nama" value="${esc(S.q)}"></div><div class="overflow-x-auto"><table class="tb"><thead><tr><th>Santri</th><th>Kelas / Kamar</th><th>Poin</th><th></th></tr></thead><tbody id="sr">${santriRows()}</tbody></table></div></div>`},
alumni(){return bar('Alumni & Nonaktif')+tbl(['Santri','Tahun','Poin akhir','Keterangan'],rows(S.alumni,a=>`<tr><td>${esc(a.nama)} <span class="text-xs text-slate-500">${esc(a.kode)}</span></td><td>${esc(a.tahun)}</td><td>${a.poin}</td><td>${esc(a.ket)}</td></tr>`,4))},
peraturan(){
  const st=isStaff(),ad=U.role==='Admin';
  return bar('Peraturan & Bobot Poin',st?'<button class="btn bg-blue-600" data-a="newP">+ Tambah</button>':'')+tbl(['Kode','Pelanggaran','Bobot',''],rows(S.peraturan.slice().sort((a,b)=>a.kode>b.kode?1:-1),p=>`<tr><td class="font-mono text-xs">${esc(p.kode)}</td><td class="whitespace-normal min-w-[200px]">${esc(p.pasal)}</td><td class="text-red-400 font-bold">${p.bobot}</td><td class="text-right">${st?`<button class="btn" data-a="editP" data-id="${esc(p.id)}"><i class="fas fa-pen"></i></button>`:''}${ad?` <button class="btn" data-a="delP" data-id="${esc(p.id)}"><i class="fas fa-trash text-red-400"></i></button>`:''}</td></tr>`,4))},
pelanggaran(){
  const st=isStaff(),ad=U.role==='Admin';
  return bar('Catatan Pelanggaran',st?'<button class="btn bg-red-600" data-a="newV">+ Catat Kasus</button>':'')+tbl(['Waktu','Santri','Pelanggaran','Poin',''],rows(S.pelanggaran.slice().sort((a,b)=>b.createdAt-a.createdAt),p=>{
    const s=S.santri.find(x=>x.id===p.santriId);
    return `<tr><td>${dt(p.createdAt)}</td><td>${esc(p.nama)}</td><td class="whitespace-normal min-w-[180px]">${esc(p.pasal)}${p.catatan?`<br><span class="text-xs text-slate-400">${esc(p.catatan)}</span>`:''}</td><td class="text-red-400 font-bold">+${p.poin}</td><td class="text-right">${st&&s&&s.poin>=100?`<button class="btn" data-a="sp" data-id="${esc(s.id)}"><i class="fas fa-file-pdf"></i> SP${lvl(s.poin)}</button>`:''}${ad?` <button class="btn" data-a="delV" data-id="${esc(p.id)}"><i class="fas fa-trash text-red-400"></i></button>`:''}</td></tr>`},5))},
absensi(){
  return bar('Absensi Barcode - '+new Date().toLocaleDateString('id-ID',{dateStyle:'long'}))+`<div class="grid md:grid-cols-3 gap-4">
  <div class="card p-4 space-y-3"><div id="reader" class="bg-black rounded-lg overflow-hidden"></div>
    <div class="flex gap-2"><button class="btn flex-1" data-a="scanStart">Mulai Kamera</button><button class="btn flex-1" data-a="scanStop">Stop</button></div>
    <select id="st" class="inp"><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option></select>
    <div class="flex gap-2"><input id="mid" class="inp" placeholder="ID santri, mis. S-001"><button class="btn" data-a="manual"><i class="fas fa-check"></i></button></div></div>
  <div class="card p-4 md:col-span-2"><p id="abs-sum" class="text-xs text-slate-400 mb-2">${absSum()}</p><div class="overflow-auto max-h-[420px]"><table class="tb"><thead><tr><th>Jam</th><th>Santri</th><th>Status</th></tr></thead><tbody id="abs">${absRows()}</tbody></table></div></div></div>`},
rekap(){return bar('Rekap Absensi Bulanan',`<input id="bln" type="month" class="inp !w-auto !py-1" value="${S.bulan}"><button class="btn" data-a="expR"><i class="fas fa-file-export"></i> Export</button>`)+tbl(['Santri','Kelas','Hadir','Izin','Sakit','Alpa'],rows(rekapData(),({s,c})=>`<tr><td>${esc(s.nama)} <span class="text-xs text-slate-500">${esc(s.id)}</span></td><td>${esc(s.kelas)}</td><td class="text-emerald-400">${c.Hadir}</td><td>${c.Izin}</td><td>${c.Sakit}</td><td class="text-red-400">${c.Alpa}</td></tr>`,6))},
logs(){return bar('Log Aktivitas')+tbl(['Waktu','Pengguna','Peran','Aktivitas'],rows(S.logs,l=>`<tr><td>${dt(l.createdAt)}</td><td>${esc(l.email)}</td><td class="text-blue-400">${esc(l.role)}</td><td>${esc(l.aksi)}</td></tr>`,4))}
};
const santriRows=()=>{const q=S.q.toLowerCase(),st=isStaff(),ad=U.role==='Admin';
  return rows(S.santri.filter(s=>s.nama.toLowerCase().includes(q)||s.id.toLowerCase().includes(q)),s=>`<tr><td><p class="text-white">${esc(s.nama)}</p><p class="text-[10px] text-slate-400">${esc(s.id)}</p></td><td>${esc(s.kelas)} / ${esc(s.kamar)}</td><td>${badge(s.poin||0)}</td><td class="text-right">${st?`<button class="btn" data-a="editS" data-id="${esc(s.id)}"><i class="fas fa-pen"></i></button> <button class="btn" data-a="card" data-id="${esc(s.id)}"><i class="fas fa-id-card"></i></button>`:''}${ad?` <button class="btn" data-a="grad" data-id="${esc(s.id)}"><i class="fas fa-user-graduate text-emerald-400"></i></button>`:''}</td></tr>`,4)};
const absRows=()=>rows(S.absensi.slice().sort((a,b)=>b.createdAt-a.createdAt),a=>`<tr><td>${esc(a.jam)}</td><td>${esc(a.nama)} <span class="text-xs text-slate-500">${esc(a.kode)}</span></td><td>${esc(a.status)}</td></tr>`,3);
const absSum=()=>['Hadir','Izin','Sakit','Alpa'].map(k=>`${k}: ${S.absensi.filter(a=>a.status===k).length}`).join('  |  ');
function charts(){
  ch.forEach(c=>c.destroy());ch=[];
  const c=[0,0,0,0],k={};S.santri.forEach(x=>{c[lvl(x.poin||0)]++;k[x.kelas]=(k[x.kelas]||0)+1});
  const o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#cbd5e1'}}}},ax={ticks:{color:'#94a3b8',precision:0}};
  ch.push(new Chart($('#c1'),{type:'doughnut',data:{labels:['Aman','SP1','SP2','SP3'],datasets:[{data:c,backgroundColor:['#10b981','#facc15','#f97316','#ef4444'],borderWidth:0}]},options:o}));
  ch.push(new Chart($('#c2'),{type:'bar',data:{labels:Object.keys(k),datasets:[{label:'Santri per kelas',data:Object.values(k),backgroundColor:'#3b82f6'}]},options:{...o,scales:{x:ax,y:ax}}}));
}

// --- santri ---
newS(){dlg('Santri Baru',`<div class="space-y-2 text-left"><input id="f1" class="inp" placeholder="ID (kosongkan = otomatis)"><input id="f2" class="inp" placeholder="Nama lengkap"><input id="f3" class="inp" placeholder="Kelas"><input id="f4" class="inp" placeholder="Kamar"></div>`,async()=>{
  let k=val('f1').toUpperCase();const n=val('f2');
  if(!n)return Swal.showValidationMessage('Nama wajib diisi');
  if(!k){const m=Math.max(0,...S.santri.map(x=>parseInt((x.id.match(/\d+$/)||[0])[0])));k='S-'+String(m+1).padStart(3,'0')}
  if(!/^[A-Z0-9-]{2,20}$/.test(k))return Swal.showValidationMessage('ID hanya huruf, angka, dan tanda -');
  if(S.santri.some(x=>x.id===k))return Swal.showValidationMessage('ID sudah dipakai');
  await setDoc(doc(db,'santri',k),{kode:k,nama:n,kelas:val('f3')||'-',kamar:val('f4')||'-',poin:0,createdAt:Date.now()});
  log('Tambah santri '+n);toast('Santri tersimpan')})},
card({id}){const s=S.santri.find(x=>x.id===id);Swal.fire({title:'Kartu Santri',showCancelButton:true,confirmButtonText:'Cetak',cancelButtonText:'Tutup',
  html:`<div id="kt" style="background:#fff;color:#000;padding:16px;border-radius:12px;border:2px solid #1e40af;display:inline-block;min-width:250px"><b style="color:#1e3a8a;font-size:17px">P.P. AL ISHLAH MANGKANG</b><div style="font-size:10px;letter-spacing:2px;color:#64748b;margin-bottom:10px">KARTU TANDA SANTRI</div><div style="font-weight:700;font-size:17px">${esc(s.nama)}</div><div style="font-size:12px;margin-bottom:8px">Kelas ${esc(s.kelas)} | Kamar ${esc(s.kamar)}</div><svg id="bc"></svg></div>`,
  didOpen:()=>JsBarcode('#bc',s.id,{format:'CODE128',width:2,height:45,fontSize:12}),
  preConfirm:()=>{const w=open('','','width=500,height=400');w.document.write('<body style="display:grid;place-items:center;height:100vh;margin:0">'+$('#kt').outerHTML+'</body>');w.document.close();setTimeout(()=>{w.print();w.close()},300);return false}})},
async grad({id}){const s=S.santri.find(x=>x.id===id);
  const r=await Swal.fire({title:'Pindahkan ke Alumni?',text:s.nama,icon:'question',showCancelButton:true,confirmButtonText:'Ya, pindahkan'});if(!r.isConfirmed)return;
  const b=writeBatch(db);b.set(doc(collection(db,'alumni')),{kode:s.id,nama:s.nama,tahun:String(new Date().getFullYear()),poin:s.poin||0,ket:(s.poin||0)>=300?'Boyong (SP3)':'Lulus',createdAt:Date.now()});b.delete(doc(db,'santri',id));
  await b.commit();log('Pindah ke alumni: '+s.nama);toast('Dipindahkan ke Alumni')},
exp(){const ws=XLSX.utils.json_to_sheet(S.santri.map(s=>({ID:s.id,Nama:s.nama,Kelas:s.kelas,Kamar:s.kamar,Poin:s.poin||0}))),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Data Santri');XLSX.writeFile(wb,'Data_Santri_Al_Ishlah.xlsx');log('Export Excel santri')},
imp(){$('#xl').click()},
editS({id}){const s=S.santri.find(x=>x.id===id);dlg('Edit Santri',`<div class="space-y-2 text-left"><p class="text-xs text-slate-400">ID: ${esc(s.id)} (tidak dapat diubah)</p><input id="f2" class="inp" placeholder="Nama lengkap" value="${esc(s.nama)}"><input id="f3" class="inp" placeholder="Kelas" value="${esc(s.kelas)}"><input id="f4" class="inp" placeholder="Kamar" value="${esc(s.kamar)}"></div>`,async()=>{
  const n=val('f2');if(!n)return Swal.showValidationMessage('Nama wajib diisi');
  await updateDoc(doc(db,'santri',id),{nama:n,kelas:val('f3')||'-',kamar:val('f4')||'-'});log('Ubah data santri '+id);toast('Perubahan tersimpan')})},
expR(){const ws=XLSX.utils.json_to_sheet(rekapData().map(({s,c})=>({ID:s.id,Nama:s.nama,Kelas:s.kelas,...c}))),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,S.bulan);XLSX.writeFile(wb,`Rekap_Absensi_${S.bulan}.xlsx`);log('Export rekap absensi '+S.bulan)},

// --- peraturan ---
newP(){A.editP({})},
editP({id}){const p=S.peraturan.find(x=>x.id===id)||{};dlg(id?'Edit Peraturan':'Tambah Peraturan',`<div class="space-y-2 text-left"><input id="f1" class="inp" placeholder="Kode, mis. P-01" value="${esc(p.kode)}"><input id="f2" class="inp" placeholder="Deskripsi pelanggaran" value="${esc(p.pasal)}"><input id="f3" type="number" min="1" class="inp" placeholder="Bobot poin" value="${esc(p.bobot)}"></div>`,async()=>{

// --- pelanggaran ---
newV(){if(!S.santri.length||!S.peraturan.length)return Swal.fire('Data kosong','Isi data santri dan peraturan dahulu.','info');
  dlg('Catat Pelanggaran',`<div class="space-y-2 text-left"><select id="f1" class="inp">${opts(S.santri,s=>`<option value="${esc(s.id)}">${esc(s.nama)} (${esc(s.id)})</option>`)}</select><select id="f2" class="inp">${opts(S.peraturan,p=>`<option value="${esc(p.id)}">${esc(p.kode)} - ${esc(p.pasal)} (+${p.bobot})</option>`)}</select><input id="f3" class="inp" placeholder="Catatan (opsional)"></div>`,async()=>{
  const s=S.santri.find(x=>x.id===val('f1')),p=S.peraturan.find(x=>x.id===val('f2')),b=writeBatch(db),old=s.poin||0,now=old+p.bobot;
  b.set(doc(collection(db,'pelanggaran')),{santriId:s.id,nama:s.nama,peraturanId:p.id,pasal:p.pasal,poin:p.bobot,catatan:val('f3'),oleh:U.name,createdAt:Date.now()});
  b.update(doc(db,'santri',s.id),{poin:increment(p.bobot)});await b.commit();
  log(`Pelanggaran ${s.id} +${p.bobot}`);
  lvl(now)>lvl(old)?setTimeout(()=>Swal.fire('Naik ke '+LV[lvl(now)][0],`${s.nama} kini ${now} poin. Segera terbitkan surat peringatan.`,'warning'),300):toast('Pelanggaran dicatat')})},
async delV({id}){const v=S.pelanggaran.find(x=>x.id===id);
  const r=await Swal.fire({title:'Hapus catatan?',text:'Poin santri akan dikurangi kembali.',icon:'warning',showCancelButton:true});if(!r.isConfirmed)return;
  const b=writeBatch(db);b.delete(doc(db,'pelanggaran',id));if(S.santri.some(s=>s.id===v.santriId))b.update(doc(db,'santri',v.santriId),{poin:increment(-v.poin)});
  await b.commit();log(`Hapus pelanggaran ${v.santriId} -${v.poin}`);toast('Dihapus')},
sp({id}){const s=S.santri.find(x=>x.id===id),n=lvl(s.poin),d=new window.jspdf.jsPDF();
  d.setFont('helvetica','bold');d.setFontSize(16);d.text('PONDOK PESANTREN AL ISHLAH',105,18,{align:'center'});
  d.setFont('helvetica','normal');d.setFontSize(10);d.text('Mangkang, Kota Semarang, Jawa Tengah',105,24,{align:'center'});d.line(20,28,190,28);
  d.setFont('helvetica','bold');d.setFontSize(12);d.text('SURAT PERINGATAN '+n,105,38,{align:'center'});d.setFont('helvetica','normal');d.setFontSize(10);
  d.text('Diberitahukan bahwa santri berikut:',20,48);
  d.autoTable({startY:52,margin:{left:20},theme:'plain',styles:{fontSize:10,cellPadding:1},columnStyles:{0:{cellWidth:35},1:{cellWidth:5}},body:[['Nama',':',s.nama],['ID',':',s.id],['Kelas / Kamar',':',s.kelas+' / '+s.kamar],['Total poin',':',String(s.poin)]]});
  const M=['','Mohon memperbaiki kedisiplinan.','Wali santri diharap menghadap pihak keamanan pondok.','Santri dikembalikan kepada orang tua/wali sesuai tata tertib.'];
  d.text(d.splitTextToSize(`Telah mencapai batas poin SP${n} (${TH[n]} poin). ${M[n]}`,170),20,d.lastAutoTable.finalY+8);
  d.autoTable({startY:d.lastAutoTable.finalY+24,head:[['Tanggal','Pelanggaran','Poin']],body:S.pelanggaran.filter(p=>p.santriId===id).map(p=>[dt(p.createdAt),p.pasal,'+'+p.poin]),styles:{fontSize:9}});
  const y=d.lastAutoTable.finalY+14;d.text('Semarang, '+new Date().toLocaleDateString('id-ID',{dateStyle:'long'}),130,y);d.text('Bagian Keamanan',130,y+7);d.text('(____________________)',130,y+30);
  d.save(`SP${n}_${s.nama.replace(/\s+/g,'_')}.pdf`);log(`Cetak SP${n} ${s.nama}`)},

async scanStart(){try{qr??=new Html5Qrcode('reader');if(qr.isScanning)return;
  await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:100}},t=>{if(Date.now()-lastScan>2500){lastScan=Date.now();absen(t.trim().toUpperCase())}},()=>{})}catch{toast('Kamera tidak dapat dibuka','error')}},
scanStop(){scanStop()},
manual(){const i=$('#mid');if(i.value.trim()){absen(i.value.trim().toUpperCase());i.value=''}},

// --- pengguna ---
async approve({id}){await updateDoc(doc(db,'users',id),{status:'approved',role:document.getElementById('r-'+id).value});log('Setujui user '+id);toast('Disetujui')},
async block({id}){await updateDoc(doc(db,'users',id),{status:'nonaktif'});log('Nonaktifkan user '+id);toast('Dinonaktifkan')},
async linkW({id}){const r=await Swal.fire({title:'Hubungkan ke ID Santri',input:'text',inputPlaceholder:'S-001',showCancelButton:true});if(!r.value)return;
  const k=r.value.trim().toUpperCase();if(!S.santri.some(s=>s.id===k))return Swal.fire('Tidak ditemukan','ID santri tidak terdaftar.','error');
  await updateDoc(doc(db,'users',id),{childId:k});log(`Hubungkan wali ${id} ke ${k}`);toast('Terhubung')}
};
function scanStop(){if(qr?.isScanning)qr.stop().catch(()=>{})}
function rekapData(){const c={};S.rekap.forEach(a=>{(c[a.kode]??={Hadir:0,Izin:0,Sakit:0,Alpa:0})[a.status]++});
  return S.santri.slice().sort((a,b)=>(a.kelas+a.nama).localeCompare(b.kelas+b.nama)).map(s=>({s,c:c[s.id]||{Hadir:0,Izin:0,Sakit:0,Alpa:0}}))}
async function loadRekap(){const b=S.bulan;
  try{S.rekap=(await getDocs(query(collection(db,'absensi'),where('tanggal','>=',b+'-01'),where('tanggal','<=',b+'-31')))).docs.map(d=>d.data())}catch{S.rekap=[];toast('Gagal memuat rekap','error')}
  paint(true)}
async function absen(kode){
  const s=S.santri.find(x=>x.id===kode);if(!s)return toast('ID tidak terdaftar','error');
  if(S.absensi.some(a=>a.kode===kode))return toast(s.nama+' sudah tercatat hari ini','info');
  const n=new Date();
  try{await setDoc(doc(db,'absensi',TODAY+'_'+kode),{kode,nama:s.nama,status:$('#st')?.value||'Hadir',tanggal:TODAY,jam:n.toTimeString().slice(0,5),createdAt:Date.now()});toast(s.nama+' - tercatat')}
  catch{toast('Gagal mencatat absensi','error')}
}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();
  try{await A[b.dataset.a]?.(b.dataset)}catch(x){toast(x.message,'error')}});
document.addEventListener('change',async e=>{if(e.target.id==='bln'&&e.target.value){S.bulan=e.target.value;return loadRekap()}const s=e.target.closest('[data-c]');if(!s)return;
  try{await updateDoc(doc(db,'users',s.dataset.c),{role:s.value});log(`Ubah peran ${s.dataset.c} ke ${s.value}`);toast('Peran diubah')}catch(x){toast(x.message,'error')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#sr').innerHTML=santriRows()}});

// ================= IMPORT EXCEL =================
$('#xl').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const j=XLSX.utils.sheet_to_json((w=>w.Sheets[w.SheetNames[0]])(XLSX.read(await f.arrayBuffer())));
    const ex=new Set(S.santri.map(s=>s.id)),add=[];
    j.forEach(r=>{const k=String(r.ID||'').trim().toUpperCase();if(r.Nama&&/^[A-Z0-9-]{2,20}$/.test(k)&&!ex.has(k)){ex.add(k);add.push([k,r])}});
    for(let i=0;i<add.length;i+=400){const b=writeBatch(db);
      add.slice(i,i+400).forEach(([k,r])=>b.set(doc(db,'santri',k),{kode:k,nama:String(r.Nama),kelas:String(r.Kelas||'-'),kamar:String(r.Kamar||'-'),poin:parseInt(r.Poin)||0,createdAt:Date.now()}));await b.commit()}
    log(`Import Excel ${add.length} santri`);Swal.fire('Selesai',`${add.length} santri diimpor. Baris tanpa ID valid/Nama atau ID ganda dilewati.`,'success');
  }catch{Swal.fire('Gagal','File Excel tidak dapat dibaca. Kolom wajib: ID, Nama, Kelas, Kamar, Poin.','error')}
  e.target.value='';
};
